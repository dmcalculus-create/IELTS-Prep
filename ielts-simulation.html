<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IELTS Simulation Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF0F4;--panel:#FFFFFF;--ink:#18212B;--muted:#556270;--line:#D3DAE2;
  --accent:#2447C7;--accent-ink:#FFFFFF;--warn:#8A4B00;--warnbg:#FFF0D6;
  --bad:#B3261E;--good:#17694B;--bar:#18212B;--barink:#F4F6F8;--soft:#F5F7FA;
  --s1:#2447C7;--s2:#D9822B;--s3:#17694B;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11161C;--panel:#1A222B;--ink:#E6EBF0;--muted:#9AA7B4;--line:#2D3844;
    --accent:#7C9BFF;--accent-ink:#0B1020;--warn:#F0B35C;--warnbg:#3A2C14;
    --bad:#FF8A80;--good:#5BD3A0;--bar:#0B0F14;--barink:#E6EBF0;--soft:#202A35;
    --s1:#7C9BFF;--s2:#F0B35C;--s3:#5BD3A0;
  }
}
:root[data-theme="dark"]{
  --bg:#11161C;--panel:#1A222B;--ink:#E6EBF0;--muted:#9AA7B4;--line:#2D3844;
  --accent:#7C9BFF;--accent-ink:#0B1020;--warn:#F0B35C;--warnbg:#3A2C14;
  --bad:#FF8A80;--good:#5BD3A0;--bar:#0B0F14;--barink:#E6EBF0;--soft:#202A35;
  --s1:#7C9BFF;--s2:#F0B35C;--s3:#5BD3A0;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
h1{font-size:1.9rem;font-weight:600;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
p{margin:0 0 .8em}
.muted{color:var(--muted)}
.small{font-size:.875rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:44px;padding:.5rem 1.1rem;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:34px;padding:.25rem .7rem;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* header bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);color:var(--barink);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;flex-wrap:wrap}
.bar .who{min-width:0}
.bar .who b{display:block;font-weight:600}
.bar .who span{font-size:.8rem;opacity:.75}
.bar .sec{font-weight:600;font-size:1.05rem}
.clock{display:flex;gap:14px;align-items:center}
.clock .blk{text-align:right;line-height:1.1}
.clock small{display:block;font-size:.7rem;opacity:.75}
.clock .t{font-variant-numeric:tabular-nums;font-size:1.55rem;font-weight:600;padding:2px 8px;border-radius:4px}
.clock .t.tot{font-size:1.05rem;font-weight:500;opacity:.9}
.clock .t.warn{background:#F0B35C;color:#2B1A00}
.clock .t.crit{background:#FF6B5E;color:#2B0600}
.banner{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:25;background:var(--warnbg);color:var(--warn);border-bottom:2px solid var(--warn);padding:10px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:600}

/* layouts */
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 48px}
.landing{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:500;margin-bottom:4px}
.field input,.field select{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.err{color:var(--bad);font-size:.85rem;margin-top:3px;min-height:1em}
.plan{width:100%;border-collapse:collapse;margin:12px 0}
.plan td,.plan th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.plan th{font-weight:600}
.sync{font-size:.8rem;color:var(--muted)}
ul.rules{padding-left:1.1rem;margin:.5rem 0}
ul.rules li{margin-bottom:.4rem}

.exam{display:grid;grid-template-columns:1fr 1fr;gap:0;max-width:1400px;margin:0 auto}
.pane{padding:20px 22px;overflow:auto;max-height:calc(100dvh - 190px);min-height:300px}
.pane.left{border-right:1px solid var(--line);background:var(--panel)}
.pane h2{margin-bottom:.3em}
.passage{font-family:var(--serif);font-size:1.08rem;line-height:1.7;max-width:68ch}
.passage p{margin-bottom:1em}
.qhead{font-weight:600;margin:18px 0 8px;padding:8px 10px;background:var(--soft);border-left:4px solid var(--accent);font-size:.92rem}
.q{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.q .n{flex:0 0 2rem;height:2rem;border-radius:50%;background:var(--ink);color:var(--panel);display:grid;place-items:center;font-size:.85rem;font-weight:600}
.q.done .n{background:var(--accent);color:var(--accent-ink)}
.q .body{flex:1;min-width:0}
.opts label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;cursor:pointer}
.opts input{margin-top:.35rem;width:18px;height:18px;flex:none}
.q input[type=text]{min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);width:min(100%,280px)}
.partnav{position:sticky;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.partnav .tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{min-height:40px;padding:6px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer}
.tab[aria-current=true]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.audio{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:16px;margin:12px 0}
.audio .st{margin-top:8px;font-size:.9rem;color:var(--muted)}
.transcript{font-family:var(--serif);margin-top:10px;padding:10px;border:1px dashed var(--line)}
textarea.essay{width:100%;min-height:320px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-family:var(--serif);font-size:1.05rem;line-height:1.6;resize:vertical}
.wc{display:flex;justify-content:space-between;font-size:.9rem;margin-top:6px}
.wc .low{color:var(--warn);font-weight:600}
.chart{margin:12px 0}
.chart svg{width:100%;height:auto;max-width:620px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.ax{stroke:var(--line);stroke-width:1}
.tx{fill:var(--muted);font-size:12px;font-family:var(--sans)}
.b1{fill:var(--s1)}.b2{fill:var(--s2)}.b3{fill:var(--s3)}
.l1,.l2,.l3{stroke-width:2.5}
.l1{stroke:var(--s1)}.l2{stroke:var(--s2);stroke-dasharray:7 4}.l3{stroke:var(--s3);stroke-dasharray:2 4}
.d1{fill:var(--s1)}.d2{fill:var(--s2)}.d3{fill:var(--s3)}

/* results */
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:18px 0}
.score{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px}
.score .pct{font-size:2.4rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.score .sub{color:var(--muted);font-size:.9rem;margin-top:6px}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--accent)}

/* dashboard */
.dash{max-width:1280px;margin:0 auto;padding:20px 16px 48px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.tile b{font-size:1.7rem;display:block;font-variant-numeric:tabular-nums}
.avg{display:grid;grid-template-columns:90px 1fr 56px;gap:10px;align-items:center;margin:8px 0}
.hist{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}
.hist div{flex:1;background:var(--accent);min-height:2px;position:relative;border-radius:3px 3px 0 0}
.hist span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:.75rem}
.histl{display:flex;gap:6px;font-size:.7rem;color:var(--muted)}.histl span{flex:1;text-align:center}
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table.res{border-collapse:collapse;width:100%;min-width:900px}
table.res th,table.res td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.res th{background:var(--soft);font-weight:600;cursor:pointer;position:sticky;top:0}
table.res td.n{font-variant-numeric:tabular-nums;text-align:right}
table.res th.n{text-align:right}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.8rem;border:1px solid var(--line)}
.chip.ok{border-color:var(--good);color:var(--good)}
.chip.ip{border-color:var(--warn);color:var(--warn)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.filters input,.filters select{min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}

/* modal */
.mb{position:fixed;inset:0;background:rgba(10,14,20,.6);z-index:100;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:10px;max-width:760px;width:100%;max-height:88dvh;overflow:auto;padding:22px;border:1px solid var(--line)}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.rev td,.rev th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.9rem}
.rev .ok{color:var(--good);font-weight:600}.rev .no{color:var(--bad);font-weight:600}
.essaybox{white-space:pre-wrap;font-family:var(--serif);background:var(--soft);padding:12px;border-radius:6px;max-height:260px;overflow:auto}

@media (max-width:820px){
  .landing,.exam,.scores{grid-template-columns:1fr}
  .pane{max-height:none;overflow:visible}
  .pane.left{border-right:0;border-bottom:1px solid var(--line)}
  .banner{top:calc(env(safe-area-inset-top,0px) + 100px)}
  .clock .t{font-size:1.3rem}
  h1{font-size:1.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.bar,.partnav,.btn{display:none}}

</style>
</head>

const BANK = {

 ["B","Hello, I'd like to join the gym, and I'd also like to ask about swimming lessons for my daughter."],
 ["A","Certainly. Can I take your surname first?"],
 ["B","It's Marsden. That's M, A, R, S, D, E, N."],

 ["B","I'll come in on Thursday then. Thank you."]],

 {t:"fill",q:"The caller will sign up on ____.",a:["Thursday"]}]},
L1b: { sec:1, title:"Enrolling on a course", kind:"Conversation between a student and an enrolment officer",
 script:[["N","Part 1. You will hear a student telephoning a college about a course."],
 ["A","Riverside Community College, enrolment office."],
 ["B","Hi, I'm calling about the photography course."],
 ["A","Of course. We have a beginners' course and an advanced course. Which one are you interested in?"],
 ["B","The beginners' course. When does it start?"],
 ["A","It begins on the fourteenth of October and runs for eight weeks. Classes are on Wednesday evenings from seven until nine."],
 ["B","And how much does it cost?"],
 ["A","It's one hundred and twenty pounds, but there is a ten per cent discount for students."],
 ["B","I'm a student, so that's good. Do I need my own camera?"],
 ["A","Yes, but any digital camera is fine. The first class is in Room twelve in the Arts Building."],
 ["B","Great. Can I pay online?"],
 ["A","Yes, on the college website, and you'll receive a confirmation email."]],
 qs:[
 {t:"fill",q:"Course: ____ (beginners)",a:["photography"]},
 {t:"fill",q:"Start date: 14 ____",a:["October","Oct"]},
 {t:"mcq",q:"On which day of the week are the classes held?",o:["Monday","Wednesday","Friday","Saturday"],a:"Wednesday"},
 {t:"fill",q:"Course fee (before discount): £ ____",a:["120","one hundred and twenty","one hundred twenty"]},
 {t:"fill",q:"First class: Room ____, Arts Building",a:["12","twelve"]}]},
L2a: { sec:2, title:"Welcome to a maritime museum", kind:"Talk by a museum guide",
 script:[["N","Part 2. You will hear a guide giving information to visitors at a museum."],
 ["A","Welcome to the Harbour Maritime Museum. Before we begin the tour, here is some useful information. The museum has three floors. On the ground floor you'll find the entrance hall, the café and the gift shop. The main exhibition about sailing ships is on the first floor, and the children's activity area is on the second floor. Please note that the lift is out of order today, so visitors who need step-free access should use the side entrance on Anchor Street, where there is a ramp. Photographs are allowed in all galleries except the Treasure Room, because flash would damage the old maps. The tour lasts about fifty minutes. At the end you can try our ship-steering simulator, which costs two pounds per person. The café closes at four thirty, so I'd suggest having lunch before the tour."]],
 qs:[
 {t:"mcq",q:"Where is the children's activity area?",o:["Ground floor","First floor","Second floor","Third floor"],a:"Second floor"},
 {t:"fill",q:"Step-free access: use the side entrance on ____ Street.",a:["Anchor"]},
 {t:"fill",q:"Photographs are not allowed in the ____ Room.",a:["Treasure"]},
 {t:"fill",q:"The tour lasts about ____ minutes.",a:["50","fifty"]},
 {t:"mcq",q:"What time does the café close?",o:["4.00","4.30","5.00","5.30"],a:"4.30"}]},
L2b: { sec:2, title:"A community plant sale", kind:"Radio announcement",
 script:[["N","Part 2. You will hear a radio announcement about a local event."],
 ["A","Hello listeners, this is a message from Oakfield Community Garden. This Saturday we are holding our annual plant sale in the village hall. Doors open at ten o'clock and the sale ends at two. Tomatoes, herbs and young fruit trees will be on sale, with prices starting at one pound fifty. All the money raised will pay for a new greenhouse. If you would like to volunteer, please arrive at eight thirty to help set up the tables. Parking is limited, so we encourage visitors to walk or cycle, and there will be free bike parking behind the hall. Hot drinks and homemade cakes will be served by the local scouts. For more information, visit our website or call the garden office."]],
 qs:[
 {t:"fill",q:"The plant sale takes place in the village ____.",a:["hall"]},
 {t:"mcq",q:"What time do the doors open?",o:["9 a.m.","10 a.m.","11 a.m.","12 noon"],a:"10 a.m."},
 {t:"fill",q:"Prices start at £ ____",a:["1.50","1.5","150","one fifty","one pound fifty"]},
 {t:"mcq",q:"The money raised will be used to buy",o:["a greenhouse","new tools","a minibus","fruit trees"],a:"a greenhouse"},
 {t:"fill",q:"Volunteers should arrive at ____",a:["8.30","830","eight thirty","half past eight","8:30"]}]},
L3a: { sec:3, title:"Planning a transport survey", kind:"Discussion between two students",
 script:[["N","Part 3. You will hear two students, Maya and Tom, discussing a project."],
 ["A","Tom, have you decided how we should collect the data for our transport project?"],
 ["B","I was thinking of a street survey, Maya, but it might take too long."],
 ["A","True. An online questionnaire would be quicker, and we could send it to students on other courses."],
 ["B","The problem is that people often don't reply. Maybe we could do both."],
 ["A","Good idea. How many responses do we need?"],
 ["B","Our tutor said at least one hundred, to make the results reliable."],
 ["A","OK. I'll write the questions this week, and you could design the charts."],
 ["B","Fine, though I'm not very confident with the software. I'll ask Dr Patel for help."],
 ["A","She's only available on Tuesdays. Let's meet again on Friday to compare our drafts."]],
 qs:[
 {t:"mcq",q:"Why do the students reject a street survey on its own?",o:["It would be expensive","It would take too long","It would be unreliable","It needs permission"],a:"It would take too long"},
 {t:"mcq",q:"What do they decide to do?",o:["Use only an online questionnaire","Use only a street survey","Use both methods","Interview the tutor"],a:"Use both methods"},
 {t:"fill",q:"Minimum number of responses needed: ____",a:["100","one hundred","a hundred"]},
 {t:"mcq",q:"Who will write the questions?",o:["Maya","Tom","Dr Patel","The tutor"],a:"Maya"},
 {t:"fill",q:"Dr Patel is only available on ____.",a:["Tuesdays","Tuesday"]}]},
L3b: { sec:3, title:"Plastic pollution presentation", kind:"Discussion between two students",
 script:[["N","Part 3. You will hear two students, Priya and Jake, preparing a presentation."],
 ["A","Jake, did you finish reading the article on plastic in rivers?"],
 ["B","Most of it, Priya. The main finding was that rivers carry far more plastic than anyone expected."],
 ["A","I was surprised that the biggest source was clothing fibres from washing machines."],
 ["B","Me too. But I'm not sure the sample was big enough. They only tested twelve rivers."],
 ["A","That's a fair point. We should mention it in our evaluation."],
 ["B","For our presentation, should we focus on causes or on solutions?"],
 ["A","Solutions, I think. Our tutor prefers practical suggestions."],
 ["B","Then let's start with filters for washing machines. Some companies are already testing them."],
 ["A","I'll prepare the slides and you can write the notes. We have fifteen minutes, so seven slides should be enough."]],
 qs:[
 {t:"mcq",q:"What was the biggest source of plastic discussed in the article?",o:["Plastic bottles","Fishing nets","Clothing fibres","Food packaging"],a:"Clothing fibres"},
 {t:"mcq",q:"What criticism of the article does Jake make?",o:["The sample was small","The data was old","The writer was biased","The title was misleading"],a:"The sample was small"},
 {t:"fill",q:"The researchers tested only ____ rivers.",a:["12","twelve"]},
 {t:"mcq",q:"What will the presentation focus on?",o:["Causes","Solutions","History","Costs"],a:"Solutions"},
 {t:"fill",q:"Number of slides they plan to use: ____",a:["7","seven"]}]},
L4a: { sec:4, title:"Urban heat islands", kind:"Academic lecture",
 script:[["N","Part 4. You will hear part of a university lecture about cities and temperature."],
 ["A","Today I'd like to talk about the urban heat island effect, which means that cities are often warmer than the countryside around them, especially at night. There are three main causes. First, dark materials such as asphalt and roofing absorb more of the sun's energy than grass or soil does. Second, cities have fewer plants, and plants cool the air by releasing water vapour. Third, cars, air conditioners and factories all give off heat. In large cities the difference in temperature can reach several degrees. This matters because hotter nights increase electricity use and can harm people's health, especially elderly residents. Planners are now trying several solutions: painting roofs white, planting trees along streets, and creating green roofs covered with vegetation. Studies suggest that white roofs can reduce indoor temperatures by up to five degrees in summer. Next week, we'll look at how these ideas are being applied in Singapore."]],
 qs:[
 {t:"fill",q:"Cities are often warmer than the countryside, especially at ____.",a:["night","night time","nighttime"]},
 {t:"fill",q:"Dark materials such as ____ absorb more of the sun's energy.",a:["asphalt"]},
 {t:"fill",q:"Plants cool the air by releasing water ____.",a:["vapour","vapor"]},
 {t:"fill",q:"White roofs can reduce indoor temperatures by up to ____ degrees.",a:["5","five"]},
 {t:"fill",q:"Next week's lecture will look at how these ideas are applied in ____.",a:["Singapore"]}]},
L4b: { sec:4, title:"Printing and the spread of ideas", kind:"Academic lecture",
 script:[["N","Part 4. You will hear part of a history lecture about early printing."],
 ["A","Today we'll look at how printing changed communication in Europe. Before the fifteenth century, books were copied by hand, usually by monks, and a single book could take months to produce. Around fourteen fifty, Johannes Gutenberg developed a printing press in Germany that used movable metal type. This made it possible to produce hundreds of copies much more quickly. By the year fifteen hundred, printing presses were operating in more than two hundred European towns. The price of books fell, and more people learned to read. Printing also helped scientific ideas to spread, because scholars could compare identical copies of the same text. However, not everyone welcomed the change. Some authorities worried that cheap pamphlets would spread dangerous opinions, and they introduced laws to control what could be printed."]],
 qs:[
 {t:"fill",q:"Before the fifteenth century, books were copied by ____.",a:["hand"]},
 {t:"fill",q:"Gutenberg developed his printing press in ____.",a:["Germany"]},
 {t:"fill",q:"By 1500, presses were operating in more than ____ European towns.",a:["200","two hundred"]},
 {t:"mcq",q:"Why did printing help scientific ideas to spread?",o:["Scholars could compare identical copies","Books became more colourful","Scientists owned the presses","Latin was no longer used"],a:"Scholars could compare identical copies"},
 {t:"fill",q:"Some authorities worried that cheap ____ would spread dangerous opinions.",a:["pamphlets","pamphlet"]}]}
},

/* ---------------- READING ---------------- */
reading: {
R1:{ title:"The Rise of the City Beehive", paras:[
"Over the past two decades, rooftop beehives have become a familiar sight in many large cities. Hotels, offices and even opera houses now keep colonies on their roofs, and the honey they produce is sold in local shops. Supporters argue that cities are surprisingly good places for bees. Parks, gardens and tree-lined streets provide a wide variety of flowering plants that bloom at different times, so bees can find food from early spring until late autumn.",
"Farmland, by contrast, often offers a single crop that flowers for only a few weeks. Urban bees also tend to encounter fewer agricultural pesticides, and the warmth that buildings give off can allow colonies to start foraging earlier in the year. A worker bee will typically travel up to three kilometres from its hive, so a single rooftop colony can draw on thousands of gardens.",
"However, the trend has its critics. Some ecologists warn that the number of hives in certain cities has grown faster than the supply of flowers. When too many honeybees compete for the same nectar, wild pollinators such as bumblebees and solitary bees may go hungry. These native species are often better than honeybees at pollinating particular plants. One study of a large European city found that wild bee numbers were lower in neighbourhoods with the densest concentrations of hives, although the researchers admitted that other factors could also have played a part.",
"Experts now recommend that city authorities monitor hive numbers and encourage the planting of flowers, rather than simply promoting beekeeping as an environmental good. Many beekeepers agree. They say the hobby's greatest value lies in making city residents more aware of the insects on which food production depends."],

R2:{ title:"Two Sleeps a Night", paras:[
"Most modern adults expect to sleep in one continuous block of seven or eight hours. Yet historical records suggest this was not always the norm. Diaries, medical books and court documents from pre-industrial Europe contain frequent references to a 'first sleep' and a 'second sleep', separated by a period of wakefulness lasting an hour or more in the middle of the night.",
"During this interval, people prayed, chatted with family members, visited neighbours or simply lay thinking. Some doctors of the time even advised couples that the hours after the first sleep were the best time for conversation. Researchers believe the pattern disappeared gradually as street lighting spread through cities in the eighteenth and nineteenth centuries, and later as electric lighting made it easy to stay awake in the evening.",
"Laboratory evidence offers some support for the idea that this pattern is natural. In one experiment, volunteers were kept in darkness for fourteen hours each day for several weeks. After a period of adjustment, most began to sleep in two phases, waking in the middle of the night for around one to two hours. Scientists remain cautious, however. They point out that the volunteers' behaviour may reflect the unusual conditions of the experiment rather than a universal human instinct.",
"For people who wake at night today, the findings may be reassuring. Many worry that waking at 3 a.m. is a sign of illness, but some sleep specialists suggest that brief night waking can be normal, provided that the person feels rested during the day."],

R3:{ title:"Power from the Tides", paras:[
"Wind and solar power have grown rapidly, but both depend on weather conditions that engineers cannot control. Tides, by contrast, are driven by the gravitational pull of the moon and sun, and their timing can be predicted years in advance. This predictability is the main reason why tidal power attracts interest from energy planners, even though it currently supplies only a tiny share of the world's electricity.",
"Two main technologies exist. A tidal barrage is a dam built across an estuary; water flows through turbines as the tide rises and falls. Barrages can generate large amounts of electricity, but they are expensive to build and can alter the habitats of fish and wading birds. The alternative is the tidal stream turbine, which resembles an underwater wind turbine and is placed on the seabed where currents are strong. These devices have a smaller environmental footprint, but they must withstand harsh conditions, and repairs at sea are costly.",
"Cost remains the biggest obstacle. Because few projects have been built, each one is close to a prototype, and the price of the electricity they produce is high compared with offshore wind. Supporters say that costs will fall as more turbines are manufactured, just as they did for solar panels. Critics reply that suitable sites are limited to a small number of coastlines, so tidal power can never be more than a supplement to other sources.",
"Despite these doubts, several governments have offered financial support for pilot schemes, hoping that experience will reveal whether the technology can become competitive."],

R4:{ title:"Building a Memory Palace", paras:[
"More than two thousand years ago, Greek and Roman speakers delivered long speeches without notes. Their secret was a technique now known as the method of loci, or the 'memory palace'. The speaker imagined walking through a familiar building and mentally placing a vivid image of each point to be remembered in a particular room or corner. To recall the speech, he simply walked through the building again, collecting the images in order.",
"The method works because human brains are far better at remembering places and striking images than lists of abstract facts. Modern memory competitors use it to memorise thousands of digits or the order of several packs of playing cards. In one study, participants with no special talent were trained for six weeks in the technique. Their scores on word-list tests improved markedly, and brain scans showed that their patterns of activity became more similar to those of experienced memory champions.",
"Educators have been slow to adopt the method. Some teachers argue that it encourages rote learning rather than understanding. Supporters respond that memorising basic facts frees mental space for analysis, just as knowing multiplication tables helps in advanced mathematics. A few medical schools now teach palace techniques for anatomy, where students must remember long lists of bones and nerves.",
"The technique is not suited to everything. It is less helpful for remembering ideas that cannot easily be turned into pictures, and it takes time and practice to build a good set of locations."],
qs:[
{t:"tfng",q:"Ancient speakers used the method of loci to remember their speeches.",a:"T"},
{t:"tfng",q:"The participants in the training study were already talented at memorising.",a:"F"},
{t:"tfng",q:"The brain activity of trained participants became more like that of memory champions.",a:"T"},
{t:"tfng",q:"The method of loci was invented in Greece.",a:"NG"},
{t:"mcq",q:"Why does the method work, according to the passage?",o:["Speeches are easy to shorten","Brains remember places and vivid images well","It avoids the need for practice","It uses written notes"],a:"Brains remember places and vivid images well"},
{t:"mcq",q:"How do supporters answer the claim that the method encourages rote learning?",o:["They deny that it works","They say memorising facts frees mental space for analysis","They suggest using it only for numbers","They recommend multiplication tables"],a:"They say memorising facts frees mental space for analysis"},
{t:"fill",q:"Some medical schools use palace techniques to teach ____.",a:["anatomy"]},
{t:"fill",q:"The technique is less helpful for ideas that cannot easily be turned into ____.",a:["pictures","images","picture"]}]},
R5:{ title:"Gardening the Reef", paras:[
"Coral reefs cover less than one per cent of the ocean floor, yet they support about a quarter of all marine species. In recent decades, rising sea temperatures have caused repeated bleaching events, in which corals expel the algae that live inside them and give them colour and food. A bleached coral is not necessarily dead, but if the heat continues for weeks it often starves.",
"In response, scientists have developed 'coral gardening'. Small fragments are broken from healthy colonies and grown in underwater nurseries, where they are protected from predators and strong waves. After several months, the fragments are attached to damaged reefs using cement or small clips. Some projects deliberately select heat-tolerant varieties, hoping to produce reefs that can survive warmer water.",
"Results have been encouraging at small scale. At several sites, restored areas have attracted fish within a year and have grown back faster than untouched damaged reefs. Yet the largest restoration projects cover only a few hectares, while degraded reefs extend for thousands of kilometres. Many researchers therefore stress that gardening can supplement, but cannot replace, efforts to reduce greenhouse gas emissions and local pollution.",
"Cost is a further concern. Planting a single hectare can cost far more than protecting an equivalent area of healthy reef through marine reserves, which suggests that prevention is the better investment."],

{t:"mcq",q:"Why does the writer suggest that prevention is the better investment?",o:["Planting costs far more than protecting healthy reef","Marine reserves attract fish","Fragments grow too slowly","Cement damages reefs"],a:"Planting costs far more than protecting healthy reef"},

<script>
(function () {
'use strict';
/* ====================== config & helpers ====================== */
const DUR = { listening: 30 * 60e3, reading: 45 * 60e3, writing: 45 * 60e3 };
const ORDER = ['listening', 'reading', 'writing'];
const KEY = { listening: 'L', reading: 'R', writing: 'W' };
const NAME = { listening: 'Listening', reading: 'Reading', writing: 'Writing' };
const LS_STATE = 'ielts_sim_state_v1', LS_RES = 'ielts_sim_results_v1';
const TEACHER_PIN = 'teacher2026';   // change this before sharing the link
const WARN_AT = 15 * 60;             // seconds: 15-minute notification

const root = document.getElementById('root');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function shuffled(arr, rnd) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, '');
const has = v => v != null && String(v).trim() !== '';
const r1 = x => Math.round(x * 10) / 10;
const fmt = s => { s = Math.max(0, s | 0); const m = Math.floor(s / 60), c = s % 60; return String(m).padStart(2, '0') + ':' + String(c).padStart(2, '0'); };
const fmtH = s => { s = Math.max(0, s | 0); const h = Math.floor(s / 3600); return h + ':' + fmt(s % 3600); };
const wordCount = t => (String(t || '').match(/[A-Za-z0-9'’-]+/g) || []).length;

/* ====================== storage (shared db + local fallback) ====================== */
const Store = {
  db: null, uid: null, mode: 'checking', ready: null, q: Promise.resolve(),
  init() {
    this.ready = (async () => {
      try {
        if (window.claude && claude.use) {
          const db = await claude.use('db');
          const user = await claude.use('user');
          const id = user ? await user.id() : null;
          if (db && id) { this.db = db; this.uid = id; this.mode = 'shared'; }
        }
      } catch (e) {}
      if (!this.db) this.mode = 'local';
      syncBadge();
    })();
  },
  local() { return ls.get(LS_RES) || {}; },
  save(rec) {
    rec.updatedAt = Date.now();
    const m = this.local(); m[rec.attemptId] = rec; ls.set(LS_RES, m);
    this.q = this.q.then(async () => {
      await Promise.race([this.ready, new Promise(r => setTimeout(r, 5000))]);
      if (!this.db) return false;
      rec.uid = this.uid;
      const clean = JSON.parse(JSON.stringify(rec));
      const ref = this.db.doc('results/' + this.uid);
      try { await ref.update({ attempts: { [rec.attemptId]: clean } }); return true; }
      catch (e) { try { await ref.set({ attempts: { [rec.attemptId]: clean } }); return true; } catch (e2) { return false; } }
    }).catch(() => false);
    return this.q;
  },
  async patchRemote(rec, patch) { // teacher-side update of a remote record
    if (!this.db || !rec.uid) return false;
    try { await this.db.doc('results/' + rec.uid).update({ attempts: { [rec.attemptId]: patch } }); return true; } catch (e) { return false; }
  }
};
function syncBadge() {
  const el = document.getElementById('sync'); if (!el) return;
  el.textContent = Store.mode === 'shared' ? 'Results sync to the shared dashboard.' : Store.mode === 'local' ? 'Results are saved on this device only (use Export on the dashboard to collect them).' : 'Checking storage…';
}

/* ====================== exam assembly ====================== */
let S = null;               // session state
let partsCache = {};
function newExam() {
  const seed = (Math.random() * 2 ** 31) >>> 0, r = mulberry32(seed);
  const pick = a => a[Math.floor(r() * a.length)];
  const L = [1, 2, 3, 4].map(k => pick(Object.keys(BANK.listening).filter(id => BANK.listening[id].sec === k)));
  const R = shuffled(Object.keys(BANK.reading), r).slice(0, 3);
  return { seed, L, R, W1: pick(Object.keys(BANK.w1)), W2: pick(Object.keys(BANK.w2)) };
}
function buildParts(exam, skill) {
  const ids = skill === 'listening' ? exam.L : exam.R, src = skill === 'listening' ? BANK.listening : BANK.reading;
  let n = 0;
  return ids.map((id, i) => {
    const c = src[id];
    const qs = c.qs.map((q, j) => {
      const o = q.o ? shuffled(q.o, mulberry32((exam.seed ^ hash(id + j)) >>> 0)) : null;
      return Object.assign({}, q, { id: id + '-' + j, o, n: ++n });
    });
    return { i, id, label: (skill === 'listening' ? 'Part ' : 'Passage ') + (i + 1), clip: c, qs, first: qs[0].n, last: qs[qs.length - 1].n };
  });
}
function parts(skill) { return partsCache[skill] || (partsCache[skill] = buildParts(S.exam, skill)); }
function allQs(skill, exam) { return buildParts(exam || S.exam, skill).flatMap(p => p.qs); }
function isCorrect(q, v) {
  if (!has(v)) return false;
  if (q.t === 'fill') return q.a.some(a => norm(a) === norm(v));
  return v === q.a;
}
function scoreObjective(skill, exam, answers) {
  const qs = allQs(skill, exam); let raw = 0;
  qs.forEach(q => { if (isCorrect(q, (answers[skill] || {})[q.id])) raw++; });
  return { raw, total: qs.length, pct: r1(raw / qs.length * 100) };
}
function bandFromPct(p) {
  const t = [[90, 9], [82.5, 8.5], [75, 8], [67.5, 7.5], [60, 7], [52.5, 6.5], [42.5, 6], [35, 5.5], [27.5, 5], [20, 4.5], [15, 4], [10, 3.5], [5, 3]];
  for (const [m, b] of t) if (p >= m) return b;
  return p > 0 ? 2.5 : 0;
}
const writingBand = p => Math.round(p / 100 * 9 * 2) / 2;

/* ---- writing: preliminary automatic scoring (heuristic) ---- */
const LINKERS = ['however', 'moreover', 'furthermore', 'in addition', 'therefore', 'consequently', 'for example', 'for instance', 'in contrast', 'on the other hand', 'as a result', 'although', 'whereas', 'while', 'nevertheless', 'in conclusion', 'to conclude', 'overall', 'firstly', 'secondly', 'finally', 'similarly', 'despite', 'in spite of', 'by contrast', 'on the whole', 'in summary', 'to sum up', 'in particular', 'by comparison'];
const COMPLEX = ['which', 'who', 'that', 'although', 'because', 'if', 'while', 'whereas', 'when', 'since', 'unless', 'whether'];
function autoWriting(text, min, task2) {
  const low = String(text || '').toLowerCase();
  const words = low.match(/[a-z']+/g) || [], wc = words.length;
  if (wc < 15) return { pct: Math.round(wc / 15 * 10), wc };
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const length = clamp(wc / min) * 25;
  const paras = String(text).split(/\n+/).filter(p => p.trim().length > 30).length;
  const need = task2 ? 4 : 3;
  const concl = /(in conclusion|to conclude|to sum up|in summary|overall|all in all)/.test(low);
  const structure = clamp(paras / need) * 12 + (concl ? 8 : 0);
  const found = LINKERS.filter(l => low.includes(l)).length;
  const cohesion = clamp(found / (task2 ? 8 : 5)) * 20;
  const content = words.filter(w => w.length > 3), uniq = new Set(content).size;
  const ttr = content.length ? uniq / content.length : 0;
  const longR = words.filter(w => w.length >= 7).length / wc;
  const lexical = clamp((ttr - 0.5) / 0.3) * 12 + clamp(longR / 0.15) * 8;
  const sents = String(text).split(/[.!?]+/).filter(s => s.trim().split(/\s+/).length > 2);
  const avg = sents.length ? wc / sents.length : 0;
  const lenQ = avg >= 12 && avg <= 28 ? 8 : avg > 0 ? 8 * clamp(1 - Math.min(Math.abs(avg - 20) - 8, 12) / 12) : 0;
  const cx = words.filter(w => COMPLEX.includes(w)).length / Math.max(1, sents.length);
  const grammar = lenQ + clamp(cx / 0.5) * 7;
  let pct = length + structure + cohesion + lexical + grammar;
  if (wc < min * 0.5) pct = Math.min(pct, 40);
  return { pct: Math.round(Math.min(100, pct)), wc };
}
function scoreWriting(w) {
  const a1 = autoWriting(w.t1, 150, false), a2 = autoWriting(w.t2, 250, true);
  return { t1: a1, t2: a2, pct: Math.round((a1.pct + a2.pct * 2) / 3) };
}
function recScoreW(rec) {
  const w = rec.writing || {};
  if (w.ai && typeof w.ai.pct === 'number') return { pct: w.ai.pct, source: 'ai', band: w.ai.band };
  if (rec.scores && rec.scores.W) return Object.assign({ source: 'auto' }, rec.scores.W);
  return null;
}
function overall(rec) {
  const s = rec.scores || {}, W = recScoreW(rec);
  const v = [s.L && s.L.pct, s.R && s.R.pct, W && W.pct].filter(x => typeof x === 'number');
  return v.length ? r1(v.reduce((a, b) => a + b, 0) / v.length) : null;
}

/* ====================== persistence of the live session ====================== */
let saveT = null;
function persist() { if (S) ls.set(LS_STATE, S); }
function persistSoon() { clearTimeout(saveT); saveT = setTimeout(persist, 400); }
function makeRecord() {
  return {
    attemptId: S.attemptId, regId: S.regId, uid: Store.uid || null,
    name: S.student.name, school: S.student.school, email: S.student.email, mobile: S.student.mobile,
    createdAt: S.createdAt, finishedAt: S.finishedAt || null,
    status: S.phase === 'done' ? 'completed' : 'in_progress', progress: S.phase,
    exam: S.exam, answers: S.answers,
    writing: { t1: S.writing.t1, t2: S.writing.t2, auto: S.writingAuto || null, ai: null },
    scores: S.scores
  };
}

/* ====================== UI utilities ====================== */
function setView(html) { root.innerHTML = html; window.scrollTo(0, 0); }
function modal(o) {
  const back = document.createElement('div'); back.className = 'mb';
  back.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><h2>' + esc(o.title) + '</h2><div class="mbody">' + (o.html || '') + '</div><div class="acts"></div></div>';
  const acts = back.querySelector('.acts');
  const close = () => back.remove();
  (o.actions || [{ label: 'Close' }]).forEach(a => {
    const b = document.createElement('button'); b.className = 'btn ' + (a.cls || ''); b.textContent = a.label;
    b.onclick = () => { if (a.fn) { const r = a.fn(back); if (r === false) return; } close(); };
    acts.appendChild(b);
  });
  document.body.appendChild(back);
  const f = back.querySelector('input,button'); if (f) f.focus();
  return { el: back, close };
}

  try { const C = window.AudioContext || window.webkitAudioContext; const c = new C(), o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = .08; o.start(); setTimeout(() => { o.stop(); c.close(); }, 350); } catch (e) {}
}

    await d.save({ filename, data });
  } catch (e) { if (!e || e.code !== 'declined') modal({ title: 'Could not save file', html: '<p>' + esc(e && e.message || 'Unknown error') + '</p>' }); }
}

function doRegister() {

  const e = {};

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(vals.email)) e.email = 'Enter a valid email address.';
  const digits = vals.mobile.replace(/\D/g, '');
  if (digits.length < 8 || digits.length > 15 || !/^[0-9+()\-\s]+$/.test(vals.mobile)) e.mobile = 'Enter a valid mobile number (8–15 digits).';
  if (Object.keys(e).length) { e._vals = vals; return viewRegister(e); }

    student: vals, regId: 'REG-' + yymm + '-' + rnd(), attemptId: 'a' + Date.now().toString(36) + rnd().toLowerCase(),
    createdAt: Date.now(), exam: newExam(), phase: 'ready', sectionEnd: 0, part: { listening: 0, reading: 0, writing: 0 },

  };

  viewReady();
}

/* ====================== timers ====================== */
let tickI = null;
const secLeft = () => Math.max(0, Math.ceil((S.sectionEnd - Date.now()) / 1000));
function totalLeft() { let t = secLeft(); const i = ORDER.indexOf(S.phase); for (let j = i + 1; j < ORDER.length; j++) t += DUR[ORDER[j]] / 1000; return t; }
function startTick() { stopTick(); tickI = setInterval(tick, 1000); tick(); }
function stopTick() { if (tickI) clearInterval(tickI); tickI = null; }
function tick() {
  if (!S || !ORDER.includes(S.phase)) return stopTick();
  const left = secLeft(), a = document.getElementById('tSec'), b = document.getElementById('tTot');
  if (a) { a.textContent = fmt(left); a.className = 't' + (left <= 300 ? ' crit' : left <= WARN_AT ? ' warn' : ''); }
  if (b) b.textContent = fmtH(totalLeft());
  const k = S.phase;
  if (left <= WARN_AT && left > 0 && !S.warned[k + '15']) { S.warned[k + '15'] = 1; persist(); showBanner('15 minutes remaining in ' + NAME[k] + '.'); if (!audio.playing) beep(); }
  if (left <= 300 && left > 0 && !S.warned[k + '5']) { S.warned[k + '5'] = 1; persist(); showBanner('5 minutes remaining in ' + NAME[k] + '.'); if (!audio.playing) beep(); }
  if (left <= 0) { stopTick(); finishSection(true); }
}
function showBanner(msg) {
  const old = document.getElementById('banner'); if (old) old.remove();
  const d = document.createElement('div'); d.id = 'banner'; d.className = 'banner'; d.setAttribute('role', 'alert');
  d.innerHTML = '<span>' + esc(msg) + '</span><button class="btn sm" data-act="closebanner">Dismiss</button>';
  const bar = document.querySelector('.bar'); if (bar) bar.after(d);
  setTimeout(() => { if (d.parentNode) d.remove(); }, 45000);
}

/* ====================== exam shell ====================== */
function header() {
  return `<header class="bar">
    <div class="who"><b>${esc(S.student.name)}</b><span>${esc(S.regId)} · ${esc(S.student.school)}</span></div>
    <div class="sec">${esc(NAME[S.phase])}</div>
    <div class="clock"><div class="blk"><small>Section time left</small><div class="t" id="tSec">${fmt(secLeft())}</div></div>
    <div class="blk"><small>Total time left</small><div class="t tot" id="tTot">${fmtH(totalLeft())}</div></div></div>
  </header>`;
}
function startSection(skill) {
  S.phase = skill; S.sectionEnd = Date.now() + DUR[skill]; S.part[skill] = 0;
  persist(); renderExam(); startTick();
}
function renderExam() {
  const k = S.phase;
  if (k === 'listening') return renderListening();
  if (k === 'reading') return renderReading();
  if (k === 'writing') return renderWriting();
}
function groupHead(q, skill) {
  if (q.t === 'tfng') return 'Do the statements agree with the information in the passage? Write TRUE, FALSE or NOT GIVEN.';
  if (q.t === 'mcq') return 'Choose the correct answer.';
  return skill === 'listening' ? 'Complete the notes. Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.' : 'Complete the sentences. Write NO MORE THAN TWO WORDS for each answer.';
}
function qHTML(q, skill) {
  const v = S.answers[skill][q.id];
  let inner = '';
  if (q.t === 'mcq') inner = '<div class="opts">' + q.o.map(o => `<label><input type="radio" name="${q.id}" value="${esc(o)}" data-qid="${q.id}" data-skill="${skill}" ${v === o ? 'checked' : ''}><span>${esc(o)}</span></label>`).join('') + '</div>';
  else if (q.t === 'tfng') inner = '<div class="opts">' + [['T', 'True'], ['F', 'False'], ['NG', 'Not Given']].map(([c, l]) => `<label><input type="radio" name="${q.id}" value="${c}" data-qid="${q.id}" data-skill="${skill}" ${v === c ? 'checked' : ''}><span>${l}</span></label>`).join('') + '</div>';
  else inner = `<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Answer to question ${q.n}" data-qid="${q.id}" data-skill="${skill}" value="${esc(v || '')}">`;
  return `<div class="q ${has(v) ? 'done' : ''}" id="q-${q.id}"><div class="n">${q.n}</div><div class="body"><div>${q.t === 'fill' ? esc(q.q).replace('____', '<b>____</b>') : esc(q.q)}</div>${inner}</div></div>`;
}
function qList(p, skill) {
  let last = '', h = '';
  p.qs.forEach(q => { if (q.t !== last) { h += `<div class="qhead">${esc(groupHead(q, skill))}</div>`; last = q.t; } h += qHTML(q, skill); });
  return h;
}
function navHTML(skill, finishLabel) {
  const ps = parts(skill), cur = S.part[skill];
  return `<nav class="partnav" aria-label="Sections"><div class="tabs">${ps.map(p => {
    const done = p.qs.filter(q => has(S.answers[skill][q.id])).length;
    return `<button class="tab" data-act="part" data-i="${p.i}" aria-current="${p.i === cur}"><span>${p.label}</span> <small data-cnt="${p.i}">${done}/${p.qs.length}</small></button>`;
  }).join('')}</div><button class="btn primary" data-act="finish">${finishLabel}</button></nav>`;
}
function updateCounts() {
  const skill = S.phase; if (!answersOf(skill)) return;
  parts(skill).forEach(p => {
    const el = document.querySelector('[data-cnt="' + p.i + '"]'); if (el) el.textContent = p.qs.filter(q => has(S.answers[skill][q.id])).length + '/' + p.qs.length;
  });
}
const answersOf = skill => S.answers[skill];

/* ---- Listening ---- */
const audio = { playing: false, token: 0, partIdx: -1 };
const ttsOK = () => 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
function renderListening() {
  const ps = parts('listening'), p = ps[S.part.listening], played = !!S.played[p.i];
  const transcript = S.showTx && S.showTx[p.i];
  setView(`${header()}<main class="exam">
   <section class="pane left">
     <h2>${p.label}: ${esc(p.clip.title)}</h2>
     <p class="muted">${esc(p.clip.kind)}. Questions ${p.first}–${p.last}.</p>
     <div class="audio">
       <button class="btn primary" data-act="play" data-i="${p.i}" ${played || audio.playing ? 'disabled' : ''}>${played ? 'Recording played' : 'Play recording'}</button>
       <div class="st" id="astat">${!ttsOK() ? 'Audio is not supported in this browser.' : played ? 'This recording can only be played once.' : 'The recording plays once only. You cannot pause or replay it.'}</div>
     </div>
     ${(!ttsOK() || transcript) ? `<div class="transcript"><b>Transcript (audio unavailable)</b>${p.clip.script.map(l => `<p>${esc(l[1])}</p>`).join('')}</div>` : (played ? `<p class="small"><button class="btn sm" data-act="tx" data-i="${p.i}">Audio did not play? Show transcript</button></p>` : '')}
   </section>
   <section class="pane"><h2>Questions ${p.first}–${p.last}</h2>${qList(p, 'listening')}</section>
  </main>${navHTML('listening', 'Finish Listening')}`);
}
function pickVoices() {
  const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)), gb = vs.filter(v => /en[-_]GB/i.test(v.lang)), base = gb.length ? gb : vs;
  return [base[0] || null, base[1] || base[0] || null];
}
function runAudio(i) {
  const p = parts('listening')[i], tok = ++audio.token; audio.playing = true; audio.partIdx = i;
  const [v1, v2] = pickVoices(); const lines = p.clip.script; let k = 0;
  const stat = t => { const e = document.getElementById('astat'); if (e) e.textContent = t; };
  stat('Playing… listen carefully and answer as you listen.');
  const btn = document.querySelector('[data-act="play"]'); if (btn) { btn.disabled = true; btn.textContent = 'Playing…'; }
  const done = () => { if (tok !== audio.token) return; audio.playing = false; stat('Recording finished. It cannot be played again.'); const b = document.querySelector('[data-act="play"]'); if (b) b.textContent = 'Recording played'; };
  const next = () => {
    if (tok !== audio.token) return;
    if (k >= lines.length) return done();
    const [sp, text] = lines[k++], u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-GB'; u.rate = .92;
    if (sp === 'B') { if (v2) u.voice = v2; u.pitch = v2 === v1 ? 1.25 : 1; } else if (v1) u.voice = v1;
    u.onend = () => setTimeout(next, sp === 'N' ? 900 : 350);
    u.onerror = () => { S.showTx = S.showTx || {}; S.showTx[i] = true; setTimeout(next, 100); };
    speechSynthesis.speak(u);
  };
  next();
}
function stopAudio() { audio.token++; audio.playing = false; if (ttsOK()) try { speechSynthesis.cancel(); } catch (e) {} }

/* ---- Reading ---- */
function renderReading() {
  const p = parts('reading')[S.part.reading];
  setView(`${header()}<main class="exam">
   <section class="pane left"><h2>${p.label}: ${esc(p.clip.title)}</h2><p class="muted">Read the passage and answer questions ${p.first}–${p.last}.</p>
     <div class="passage">${p.clip.paras.map(t => '<p>' + esc(t) + '</p>').join('')}</div></section>
   <section class="pane"><h2>Questions ${p.first}–${p.last}</h2>${qList(p, 'reading')}</section>
  </main>${navHTML('reading', 'Finish Reading')}`);
}

/* ---- Writing ---- */
function niceStep(mx) { const raw = mx / 5, pow = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / pow; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * pow; }
function chartSVG(t) {
  const W = 560, H = 310, L = 46, R = 14, T = 14, B = 64, iw = W - L - R, ih = H - T - B;
  const mx = Math.max.apply(null, t.series.flatMap(s => s.vals)), step = niceStep(mx), top = Math.ceil(mx / step) * step, n = t.labels.length;
  let g = '';
  for (let v = 0; v <= top; v += step) { const y = T + ih - v / top * ih; g += `<line class="ax" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="tx" x="${L - 6}" y="${y + 4}" text-anchor="end">${v}</text>`; }
  if (t.type === 'bar') {
    const gw = iw / n, bw = gw * .72 / t.series.length;
    t.labels.forEach((lb, i) => { const gx = L + i * gw + gw * .14; t.series.forEach((s, k) => { const h = s.vals[i] / top * ih; g += `<rect class="b${k + 1}" x="${gx + k * bw}" y="${T + ih - h}" width="${bw - 2}" height="${h}"/>`; }); g += `<text class="tx" x="${L + i * gw + gw / 2}" y="${T + ih + 18}" text-anchor="middle">${esc(lb)}</text>`; });
  } else {
    t.series.forEach((s, k) => { const pts = s.vals.map((v, i) => [L + (i + .5) * iw / n, T + ih - v / top * ih]); g += `<polyline class="l${k + 1}" fill="none" points="${pts.map(p => p.join(',')).join(' ')}"/>`; pts.forEach(p => { g += `<circle class="d${k + 1}" cx="${p[0]}" cy="${p[1]}" r="3.5"/>`; }); });
    t.labels.forEach((lb, i) => { g += `<text class="tx" x="${L + (i + .5) * iw / n}" y="${T + ih + 18}" text-anchor="middle">${esc(lb)}</text>`; });
  }
  t.series.forEach((s, k) => { const x = L + k * 120, y = H - 16; g += t.type === 'bar' ? `<rect class="b${k + 1}" x="${x}" y="${y - 10}" width="12" height="12"/>` : `<line class="l${k + 1}" x1="${x}" x2="${x + 18}" y1="${y - 4}" y2="${y - 4}"/>`; g += `<text class="tx" x="${x + 24}" y="${y + 1}">${esc(s.name)}</text>`; });
  g += `<text class="tx" x="${L}" y="${T - 2}" style="font-size:11px">${esc(t.unit)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t.title)} chart">${g}</svg>`;
}
function renderWriting() {
  const tab = S.writing.tab || 1, t1 = BANK.w1[S.exam.W1], t2 = BANK.w2[S.exam.W2];
  const left = tab === 1
    ? `<h2>Writing Task 1</h2><p class="muted">You should spend about 15 minutes on this task.</p><p>${esc(t1.prompt)}</p><div class="chart">${chartSVG(t1)}</div><p>Summarise the information by selecting and reporting the main features, and make comparisons where relevant.</p><p><b>Write at least 150 words.</b></p>`
    : `<h2>Writing Task 2</h2><p class="muted">You should spend about 30 minutes on this task.</p><p>Write about the following topic:</p><div class="card" style="font-family:var(--serif);font-size:1.1rem">${esc(t2)}</div><p style="margin-top:12px">Give reasons for your answer and include any relevant examples from your own knowledge or experience.</p><p><b>Write at least 250 words.</b></p>`;
  const min = tab === 1 ? 150 : 250, txt = tab === 1 ? S.writing.t1 : S.writing.t2, wc = wordCount(txt);
  setView(`${header()}<main class="exam"><section class="pane left">${left}</section>
   <section class="pane"><label for="wtext"><b>Your answer – Task ${tab}</b></label>
    <textarea id="wtext" class="essay" data-task="${tab}" spellcheck="false" autocomplete="off" autocapitalize="sentences">${esc(txt)}</textarea>
    <div class="wc"><span id="wcnt" class="${wc < min ? 'low' : ''}">Word count: ${wc}</span><span class="muted">Minimum ${min} words</span></div></section></main>
   <nav class="partnav"><div class="tabs">
     <button class="tab" data-act="wtab" data-i="1" aria-current="${tab === 1}">Task 1 <small id="wc1">${wordCount(S.writing.t1)}w</small></button>
     <button class="tab" data-act="wtab" data-i="2" aria-current="${tab === 2}">Task 2 <small id="wc2">${wordCount(S.writing.t2)}w</small></button></div>
     <button class="btn primary" data-act="finish">Submit test</button></nav>`);
}

/* ====================== finishing ====================== */
function confirmFinish() {
  const skill = S.phase; let body = '';
  if (skill === 'writing') {
    const a = wordCount(S.writing.t1), b = wordCount(S.writing.t2);
    body = `<p>Task 1: ${a} words${a < 150 ? ' (under 150)' : ''}. Task 2: ${b} words${b < 250 ? ' (under 250)' : ''}.</p><p>After submitting you cannot change your answers.</p>`;
  } else {
    const qs = parts(skill).flatMap(p => p.qs), un = qs.filter(q => !has(S.answers[skill][q.id])).length;
    body = `<p>${un ? '<b>' + un + ' question' + (un > 1 ? 's' : '') + ' unanswered.</b> ' : 'All questions answered. '}You cannot return to this section.</p>`;
  }
  modal({ title: 'Finish ' + NAME[skill] + '?', html: body, actions: [{ label: 'Keep working' }, { label: 'Finish now', cls: 'primary', fn: () => finishSection(false) }] });
}
async function finishSection(auto) {
  const skill = S.phase; if (!ORDER.includes(skill)) return;
  stopTick(); stopAudio(); document.querySelectorAll('.mb').forEach(m => m.remove());
  if (skill === 'writing') { S.writingAuto = scoreWriting(S.writing); S.scores.W = { pct: S.writingAuto.pct, source: 'auto', band: writingBand(S.writingAuto.pct), t1: S.writingAuto.t1, t2: S.writingAuto.t2 }; }
  else { const sc = scoreObjective(skill, S.exam, S.answers); sc.band = bandFromPct(sc.pct); S.scores[KEY[skill]] = sc; }
  const i = ORDER.indexOf(skill);
  if (i < ORDER.length - 1) { S.phase = 'between'; S.next = ORDER[i + 1]; S.lastAuto = !!auto; S.lastDone = skill; }
  else { S.phase = 'done'; S.finishedAt = Date.now(); }
  persist(); Store.save(makeRecord());
  S.phase === 'done' ? viewResult() : viewBetween();
}
function viewBetween() {
  setView(`<div class="wrap" style="max-width:640px"><h1>${esc(NAME[S.lastDone])} complete</h1>
   <div class="card"><p>${S.lastAuto ? 'Time was up, so your answers were submitted automatically.' : 'Your answers have been submitted.'}</p>
   <p>Next: <b>${esc(NAME[S.next])}</b> (${DUR[S.next] / 60000} minutes). The clock for the next section starts only when you press the button below.</p>
   ${S.next === 'listening' ? '' : ''}<button class="btn primary" data-act="start" data-skill="${S.next}">Start ${esc(NAME[S.next])}</button></div></div>`);
}
function viewResult() {
  const sc = S.scores, rec = makeRecord(), ov = overall(rec), W = recScoreW(rec);
  const card = (n, o, extra) => `<div class="score"><h3>${n}</h3><div class="pct">${o.pct}%</div><div class="sub">${extra}</div><div class="meter"><i style="width:${o.pct}%"></i></div></div>`;
  setView(`<div class="wrap"><div class="sync" id="sync"></div><h1>Test complete</h1>

   <button class="btn" data-act="dlself">Download my result file</button> <button class="btn" data-act="newcand">Register next candidate</button></div></div>`);
  syncBadge();
}

/* ====================== teacher dashboard ====================== */
let dash = { recs: {}, unsub: null, f: { q: '', school: '', status: '' }, sort: { k: 'createdAt', d: -1 } };
async function isTeacher() { try { const u = window.claude && claude.use ? await claude.use('user') : null; return !!(u && await u.canEdit()); } catch (e) { return false; } }
async function openDashboard() {

    actions: [{ label: 'Cancel' }, { label: 'Open', cls: 'primary', fn: m => { if (m.querySelector('#pin').value === TEACHER_PIN) { setTimeout(showDashboard, 0); return true; } m.querySelector('#pinerr').textContent = 'Incorrect PIN.'; return false; } }] });
}
function mergeRecs(list) { list.forEach(r => { const o = dash.recs[r.attemptId]; if (!o || (r.updatedAt || 0) >= (o.updatedAt || 0)) dash.recs[r.attemptId] = r; }); }
async function showDashboard() {
  dash.recs = {}; mergeRecs(Object.values(Store.local()));
  await Promise.race([Store.ready, new Promise(r => setTimeout(r, 3000))]);
  if (Store.db) {
    if (dash.unsub) dash.unsub();
    try {
      dash.unsub = Store.db.collection('results').onSnapshot(snap => {
        snap.docs.forEach(d => { const a = (d.data() || {}).attempts || {}; mergeRecs(Object.values(a)); });
        if (document.getElementById('dashBody')) renderDash();
      }, () => {});
    } catch (e) {}

  setView('<div id="dashRoot"></div>'); renderDash(true);
}
function filtered() {
  const f = dash.f, q = f.q.toLowerCase();
  let a = Object.values(dash.recs).filter(r => (!q || (r.name + ' ' + r.regId + ' ' + r.email + ' ' + r.mobile).toLowerCase().includes(q)) && (!f.school || r.school === f.school) && (!f.status || r.status === f.status));
  const k = dash.sort.k, d = dash.sort.d;
  const val = r => k === 'L' ? (r.scores.L || {}).pct : k === 'R' ? (r.scores.R || {}).pct : k === 'W' ? (recScoreW(r) || {}).pct : k === 'O' ? overall(r) : (r[k] || '');
  a.sort((x, y) => { const p = val(x), q2 = val(y); if (p == null) return 1; if (q2 == null) return -1; return (p > q2 ? 1 : p < q2 ? -1 : 0) * d; });
  return a;
}
function avgOf(list, fn) { const v = list.map(fn).filter(x => typeof x === 'number'); return v.length ? r1(v.reduce((a, b) => a + b, 0) / v.length) : null; }
function renderDash(full) {
  const all = Object.values(dash.recs), list = filtered(), schools = [...new Set(all.map(r => r.school))].sort();
  const done = list.filter(r => r.status === 'completed');
  const aL = avgOf(list, r => (r.scores.L || {}).pct), aR = avgOf(list, r => (r.scores.R || {}).pct), aW = avgOf(list, r => (recScoreW(r) || {}).pct), aO = avgOf(list, overall);
  const bins = new Array(10).fill(0); done.forEach(r => { const o = overall(r); if (o != null) bins[Math.min(9, Math.floor(o / 10))]++; });
  const mb = Math.max(1, ...bins);
  const pc = v => v == null ? '–' : v + '%';
  const sk = (k, l, cls) => `<th data-sort="${k}" class="${cls || ''}">${l}${dash.sort.k === k ? (dash.sort.d > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  const rows = list.map(r => { const W = recScoreW(r); return `<tr data-act="detail" data-id="${esc(r.attemptId)}" style="cursor:pointer">
    <td>${esc(r.regId)}</td><td>${esc(r.name)}</td><td>${esc(r.school)}</td>
    <td class="n">${pc((r.scores.L || {}).pct)}</td><td class="n">${pc((r.scores.R || {}).pct)}</td><td class="n">${W ? W.pct + '%' + (W.source === 'ai' ? '' : '*') : '–'}</td>
    <td class="n"><b>${pc(overall(r))}</b></td><td><span class="chip ${r.status === 'completed' ? 'ok' : 'ip'}">${r.status === 'completed' ? 'Completed' : 'In progress'}</span></td></tr>`; }).join('');
  const html = `<div class="dash" id="dashBody">
   <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
     <h1 style="margin:0">Results dashboard</h1>
     <div style="display:flex;gap:8px;flex-wrap:wrap">
       <button class="btn sm" data-act="csv">Export CSV</button><button class="btn sm" data-act="json">Backup JSON</button>
       <label class="btn sm" for="imp">Import JSON</label><input id="imp" type="file" accept=".json,application/json" style="display:none">
       <button class="btn sm" data-act="aiall">Assess writing with Claude</button>
       <button class="btn sm primary" data-act="home">Close</button></div></div>
   <p class="sync" id="sync"></p>
   <div class="tiles">
     <div class="tile"><b>${list.length}</b>Candidates (${done.length} completed)</div>
     <div class="tile"><b>${pc(aL)}</b>Avg Listening</div><div class="tile"><b>${pc(aR)}</b>Avg Reading</div>
     <div class="tile"><b>${pc(aW)}</b>Avg Writing</div><div class="tile"><b>${pc(aO)}</b>Avg overall</div></div>
   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px">
     <div class="card"><h3>Average by skill</h3>
       ${[['Listening', aL], ['Reading', aR], ['Writing', aW]].map(([n, v]) => `<div class="avg"><span>${n}</span><div class="meter" style="margin:0"><i style="width:${v || 0}%"></i></div><b>${pc(v)}</b></div>`).join('')}</div>
     <div class="card"><h3>Overall score distribution (completed)</h3>
       <div class="hist">${bins.map(b => `<div style="height:${Math.max(2, b / mb * 100)}%"><span>${b || ''}</span></div>`).join('')}</div>
       <div class="histl">${bins.map((b, i) => `<span>${i * 10}</span>`).join('')}</div></div></div>
   <div class="filters">
     <input id="fq" placeholder="Search name, ID, email, mobile" value="${esc(dash.f.q)}" style="min-width:240px">
     <select id="fs"><option value="">All schools</option>${schools.map(s => `<option ${dash.f.school === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
     <select id="fst"><option value="">All statuses</option><option value="completed" ${dash.f.status === 'completed' ? 'selected' : ''}>Completed</option><option value="in_progress" ${dash.f.status === 'in_progress' ? 'selected' : ''}>In progress</option></select></div>
   <div class="twrap"><table class="res"><thead><tr>${sk('regId', 'Registration ID')}${sk('name', 'Name')}${sk('school', 'School')}${sk('L', 'Listening', 'n')}${sk('R', 'Reading', 'n')}${sk('W', 'Writing', 'n')}${sk('O', 'Overall', 'n')}<th>Status</th></tr></thead>
   <tbody>${rows || '<tr><td colspan="8" class="muted" style="padding:24px">No results yet. Results appear here as candidates finish each section.</td></tr>'}</tbody></table></div>
   <p class="small muted">* Writing marked with an asterisk is the preliminary automatic score. Use “Assess writing with Claude” for a criteria-based assessment. Click a row for answers and essays.</p></div>`;
  const rootEl = document.getElementById('dashRoot');
  if (!rootEl) return;
  const focusId = document.activeElement && document.activeElement.id, pos = document.activeElement && document.activeElement.selectionStart;
  rootEl.innerHTML = html; syncBadge();
  if (focusId === 'fq') { const e = document.getElementById('fq'); e.focus(); try { e.setSelectionRange(pos, pos); } catch (x) {} }
  document.getElementById('fq').oninput = e => { dash.f.q = e.target.value; renderDash(); };
  document.getElementById('fs').onchange = e => { dash.f.school = e.target.value; renderDash(); };
  document.getElementById('fst').onchange = e => { dash.f.status = e.target.value; renderDash(); };
  document.getElementById('imp').onchange = importJSON;
  document.querySelectorAll('[data-sort]').forEach(th => th.onclick = () => { const k = th.dataset.sort; dash.sort = { k, d: dash.sort.k === k ? -dash.sort.d : -1 }; renderDash(); });
}
function csvCell(v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportCSV() {
  const head = ['Registration ID', 'Name', 'School', 'Email', 'Mobile', 'Status', 'Listening %', 'Reading %', 'Writing %', 'Writing source', 'Overall %', 'Started'];
  const lines = [head].concat(filtered().map(r => { const W = recScoreW(r) || {}; return [r.regId, r.name, r.school, r.email, r.mobile, r.status, (r.scores.L || {}).pct, (r.scores.R || {}).pct, W.pct, W.source, overall(r), new Date(r.createdAt).toISOString()]; }));
  saveFile('ielts-results.csv', '\uFEFF' + lines.map(l => l.map(csvCell).join(',')).join('\n'));
}
function importJSON(e) {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { const d = JSON.parse(rd.result), arr = Array.isArray(d) ? d : [d]; const ok = arr.filter(r => r && r.attemptId && r.scores); mergeRecs(ok); const m = Store.local(); ok.forEach(r => { m[r.attemptId] = r; }); ls.set(LS_RES, m); renderDash(); modal({ title: 'Import complete', html: '<p>' + ok.length + ' result(s) imported.</p>' }); } catch (x) { modal({ title: 'Import failed', html: '<p>The file is not a valid results file.</p>' }); } };
  rd.readAsText(f);
}
function detail(id) {
  const r = dash.recs[id]; if (!r) return;
  const W = recScoreW(r) || {}, rev = sk => allQs(sk, r.exam).map(q => { const v = (r.answers[sk] || {})[q.id], ok = isCorrect(q, v); return `<tr><td>${q.n}</td><td>${esc(q.q)}</td><td>${esc(has(v) ? v : '—')}</td><td>${esc(Array.isArray(q.a) ? q.a[0] : q.a)}</td><td class="${ok ? 'ok' : 'no'}">${ok ? '✓' : '✗'}</td></tr>`; }).join('');
  const w = r.writing || {}, ai = w.ai;
  const html = `<p><b>${esc(r.name)}</b> · ${esc(r.regId)}<br>${esc(r.school)} · ${esc(r.email)} · ${esc(r.mobile)}</p>
   <p>Listening <b>${(r.scores.L || {}).pct ?? '–'}%</b> (${(r.scores.L || {}).raw ?? '–'}/${(r.scores.L || {}).total ?? '–'}) · Reading <b>${(r.scores.R || {}).pct ?? '–'}%</b> (${(r.scores.R || {}).raw ?? '–'}/${(r.scores.R || {}).total ?? '–'}) · Writing <b>${W.pct ?? '–'}%</b> (${W.source === 'ai' ? 'Claude assessment' : 'automatic'}) · Overall <b>${overall(r) ?? '–'}%</b></p>
   ${ai ? `<div class="card"><b>Writing assessment</b><p class="small">Task 1 band ${ai.t1.band} · Task 2 band ${ai.t2.band} · Writing band ${ai.band}</p><p class="small"><b>Task 1:</b> ${esc(ai.t1.comment)}</p><p class="small"><b>Task 2:</b> ${esc(ai.t2.comment)}</p></div>` : ''}
   <h3 style="margin-top:14px">Listening answers</h3><table class="rev"><tr><th>#</th><th>Question</th><th>Answer</th><th>Key</th><th></th></tr>${rev('listening')}</table>
   <h3 style="margin-top:14px">Reading answers</h3><table class="rev"><tr><th>#</th><th>Question</th><th>Answer</th><th>Key</th><th></th></tr>${rev('reading')}</table>
   <h3 style="margin-top:14px">Writing Task 1 (${wordCount(w.t1)} words)</h3><p class="small muted">${esc(BANK.w1[r.exam.W1].prompt)}</p><div class="essaybox">${esc(w.t1 || '(no answer)')}</div>
   <h3 style="margin-top:14px">Writing Task 2 (${wordCount(w.t2)} words)</h3><p class="small muted">${esc(BANK.w2[r.exam.W2])}</p><div class="essaybox">${esc(w.t2 || '(no answer)')}</div>`;
  const acts = [{ label: 'Close' }];
  if (r.status === 'completed') acts.unshift({ label: ai ? 'Re-assess writing' : 'Assess writing with Claude', cls: 'primary', fn: () => { gradeOne(r).then(() => { renderDash(); detail(id); }).catch(gradeError); } });
  modal({ title: 'Candidate detail', html, actions: acts });
}
function gradeError(e) {
  const m = e && e.code === 'not_granted' ? 'Permission to use Claude was declined.' : (e && e.message) || 'Assessment failed.';
  modal({ title: 'Writing assessment', html: '<p>' + esc(m) + '</p>' });
}
async function gradeOne(rec) {
  const sample = window.claude && claude.use ? await claude.use('sample') : null;
  if (!sample) throw { message: 'Claude assessment is not available in this view.' };
  const t1 = BANK.w1[rec.exam.W1], t2 = BANK.w2[rec.exam.W2];
  const data = t1.labels.map((l, i) => l + ': ' + t1.series.map(s => s.name + ' ' + s.vals[i]).join(', ')).join('; ');
  const prompt = `You are a certified IELTS Academic Writing examiner. Assess the two answers below using the official public band descriptors (Task Achievement/Response, Coherence and Cohesion, Lexical Resource, Grammatical Range and Accuracy). Use half-band steps from 0 to 9. Be strict and realistic; an answer far below the word minimum should lose marks, and an empty answer scores 0.

TASK 1 (minimum 150 words). Prompt: ${t1.prompt} Chart data (${t1.unit}): ${data}.
CANDIDATE TASK 1 ANSWER:
"""${rec.writing.t1 || ''}"""

TASK 2 (minimum 250 words). Prompt: ${t2}
CANDIDATE TASK 2 ANSWER:
"""${rec.writing.t2 || ''}"""

Return ONLY valid JSON, no markdown, in exactly this shape:
{"t1":{"TA":0,"CC":0,"LR":0,"GRA":0,"comment":"two or three sentences of specific feedback"},"t2":{"TA":0,"CC":0,"LR":0,"GRA":0,"comment":"two or three sentences of specific feedback"}}`;
  const r = await sample.json(prompt, { modelTier: 'default' });

  const b1 = avg(r.t1), b2 = avg(r.t2), band = Math.round(((b1 + 2 * b2) / 3) * 2) / 2;
  const ai = { t1: { band: b1, TA: r.t1.TA, CC: r.t1.CC, LR: r.t1.LR, GRA: r.t1.GRA, comment: String(r.t1.comment || '') }, t2: { band: b2, TA: r.t2.TA, CC: r.t2.CC, LR: r.t2.LR, GRA: r.t2.GRA, comment: String(r.t2.comment || '') }, band, pct: Math.round(band / 9 * 1000) / 10 };
  rec.writing = Object.assign({}, rec.writing, { ai }); rec.updatedAt = Date.now();
  const m = Store.local(); if (m[rec.attemptId]) { m[rec.attemptId].writing = rec.writing; m[rec.attemptId].updatedAt = rec.updatedAt; ls.set(LS_RES, m); }
  await Store.patchRemote(rec, { writing: { ai }, updatedAt: rec.updatedAt });
}
async function gradeAll() {
  const todo = Object.values(dash.recs).filter(r => r.status === 'completed' && !(r.writing && r.writing.ai));
  if (!todo.length) return modal({ title: 'Writing assessment', html: '<p>All completed candidates already have a Claude assessment.</p>' });
  const m = modal({ title: 'Assessing writing', html: '<p id="gp">Starting…</p>', actions: [{ label: 'Close' }] });
  let ok = 0;
  for (let i = 0; i < todo.length; i++) {
    const p = m.el.querySelector('#gp'); if (!p) return;
    p.textContent = 'Assessing ' + (i + 1) + ' of ' + todo.length + ': ' + todo[i].name + '…';
    try { await gradeOne(todo[i]); ok++; } catch (e) { if (e && (e.code === 'not_granted' || e.code === 'rate_limited')) { p.textContent = e.code === 'not_granted' ? 'Permission was declined.' : 'Rate limit reached. Try again shortly.'; renderDash(); return; } }
  }
  const p = m.el.querySelector('#gp'); if (p) p.textContent = 'Done. ' + ok + ' of ' + todo.length + ' assessed.';
  renderDash();
}

/* ====================== events ====================== */
root.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.qid) {
    S.answers[el.dataset.skill][el.dataset.qid] = el.value;
    const q = document.getElementById('q-' + el.dataset.qid); if (q) q.classList.toggle('done', has(el.value));
    updateCounts(); persistSoon();
  } else if (el.id === 'wtext') {
    const tab = el.dataset.task; S.writing['t' + tab] = el.value;
    const wc = wordCount(el.value), min = tab === '1' ? 150 : 250, c = document.getElementById('wcnt');
    if (c) { c.textContent = 'Word count: ' + wc; c.className = wc < min ? 'low' : ''; }
    const t = document.getElementById('wc' + tab); if (t) t.textContent = wc + 'w';
    persistSoon();
  }
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'register') doRegister();
  else if (a === 'teacher') openDashboard();
  else if (a === 'resume') { const sv = ls.get(LS_STATE); if (!sv) return; S = sv; partsCache = {}; S.played = S.played || {}; S.warned = S.warned || {}; resume(); }
  else if (a === 'audiotest') { const el = document.getElementById('atest'); if (!ttsOK()) { el.textContent = 'This browser cannot play audio. Transcripts will be shown instead.'; return; } try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance('Can you hear this sentence clearly?'); u.lang = 'en-GB'; speechSynthesis.speak(u); el.textContent = 'You should hear a spoken sentence.'; } catch (x) { el.textContent = 'Audio test failed.'; } }
  else if (a === 'start') { stopAudio(); startSection(t.dataset.skill); }
  else if (a === 'part') { S.part[S.phase] = +t.dataset.i; persist(); renderExam(); }
  else if (a === 'wtab') { S.writing.tab = +t.dataset.i; persist(); renderWriting(); }
  else if (a === 'play') { const i = +t.dataset.i; if (S.played[i] || audio.playing) return; if (!ttsOK()) return; S.played[i] = true; persist(); runAudio(i); }
  else if (a === 'tx') { S.showTx = S.showTx || {}; S.showTx[+t.dataset.i] = true; renderListening(); }
  else if (a === 'finish') confirmFinish();
  else if (a === 'closebanner') { const b = document.getElementById('banner'); if (b) b.remove(); }
  else if (a === 'newcand') { ls.del(LS_STATE); S = null; viewRegister(); }
  else if (a === 'dlself') { saveFile('ielts-result-' + S.regId + '.json', JSON.stringify(makeRecord(), null, 1)); }
  else if (a === 'home') { if (dash.unsub) { dash.unsub(); dash.unsub = null; } S = ls.get(LS_STATE) && ls.get(LS_STATE).phase === 'done' ? null : S; viewRegister(); }
  else if (a === 'detail') detail(t.dataset.id);
  else if (a === 'csv') exportCSV();
  else if (a === 'json') saveFile('ielts-results-backup.json', JSON.stringify(Object.values(dash.recs), null, 1));
  else if (a === 'aiall') gradeAll();
});
window.addEventListener('beforeunload', persist);
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });

function resume() {
  if (S.phase === 'ready') return viewReady();
  if (S.phase === 'between') return viewBetween();
  if (S.phase === 'done') return viewResult();
  if (ORDER.includes(S.phase)) {
    if (Date.now() >= S.sectionEnd) return finishSection(true);
    renderExam(); startTick();
  }
}

/* ====================== boot ====================== */
Store.init();
viewRegister();
})();
